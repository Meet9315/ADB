name: Validate Skills

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: agentskills.io SKILL.md compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run skill validator
        run: |
          python scripts/validate_skills.py \
            --skills-dir skills \
            --marketplace marketplace.json

      - name: Run archetype benchmark suite
        run: |
          python skills/machine-readability-audit/tests/test_archetype_fixtures.py

      - name: Run deterministic check fixture tests
        run: |
          python skills/machine-readability-audit/tests/run_fixtures.py

      - name: Run orchestrator pydantic tests
        run: |
          pytest skills/audit-orchestrator/tests/test_models.py

      - name: Run robots RFC 9309 unit tests
        run: |
          pytest skills/site-acquisition/tests/test_robots.py


